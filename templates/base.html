<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employee Management</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f4f6f8; color: #1f2933; }
    header { background: #1d3557; color: #fff; padding: 16px 24px; }
    header a { color: #fff; text-decoration: none; font-weight: 600; font-size: 20px; }
    main { max-width: 960px; margin: 24px auto; padding: 0 16px; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; }
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #e4e7eb; font-size: 14px; }
    th { background: #e9eef3; }
    .btn { display: inline-block; padding: 8px 14px; border: 0; border-radius: 6px; background: #457b9d; color: #fff; text-decoration: none; cursor: pointer; font-size: 14px; }
    .btn.danger { background: #d62828; }
    .btn.gray { background: #6b7280; }
    .bar { display: flex; gap: 8px; margin-bottom: 16px; justify-content: space-between; flex-wrap: wrap; }
    input { padding: 8px; border: 1px solid #cbd2d9; border-radius: 6px; font-size: 14px; }
    form.card { background: #fff; padding: 20px; border-radius: 8px; display: grid; gap: 12px; }
    form.card label { display: grid; gap: 4px; font-size: 14px; font-weight: 600; }
    .flash { padding: 10px 14px; border-radius: 6px; margin-bottom: 12px; }
    .flash.success { background: #d8f3dc; }
    .flash.error { background: #ffd6d6; }
    .inline { display: inline; }
  </style>
</head>
<body>
  <header><a href="{{ url_for('index') }}">Employee Management</a></header>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
