{% extends 'base.html' %}
{% block content %}
<h2>{{ 'Edit' if employee else 'Add' }} employee</h2>
<form class="card" method="post">
  <label>Name <input name="name" required value="{{ employee.name if employee else request.form.get('name', '') }}"></label>
  <label>Email <input type="email" name="email" required value="{{ employee.email if employee else request.form.get('email', '') }}"></label>
  <label>Department <input name="department" value="{{ (employee.department or '') if employee else request.form.get('department', '') }}"></label>
  <label>Position <input name="position" value="{{ (employee.position or '') if employee else request.form.get('position', '') }}"></label>
  <label>Salary <input type="number" step="0.01" name="salary" value="{{ (employee.salary if employee and employee.salary is not none else '') if employee else request.form.get('salary', '') }}"></label>
  <label>Hire date <input type="date" name="hire_date" value="{{ (employee.hire_date or '') if employee else request.form.get('hire_date', '') }}"></label>
  <div>
    <button class="btn" type="submit">Save</button>
    <a class="btn gray" href="{{ url_for('index') }}">Cancel</a>
  </div>
</form>
{% endblock %}
